services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-datacraft}
      POSTGRES_USER: ${POSTGRES_USER:-datacraft}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datacraft}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes: ["datacraft-postgres-data:/var/lib/postgresql/data", "./docker/postgres/init:/docker-entrypoint-initdb.d:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8-alpine
    command: redis-server --appendonly yes
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes: ["datacraft-redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  mysql-test:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_TEST_ROOT_PASSWORD:-datacraft}
      MYSQL_DATABASE: ${MYSQL_TEST_DATABASE:-datacraft_test}
      MYSQL_USER: ${MYSQL_TEST_USER:-datacraft}
      MYSQL_PASSWORD: ${MYSQL_TEST_PASSWORD:-datacraft}
    ports: ["${MYSQL_TEST_PORT:-3306}:3306"]
    volumes: ["datacraft-mysql-test-data:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  datacraft-postgres-data:
  datacraft-redis-data:
  datacraft-mysql-test-data:
