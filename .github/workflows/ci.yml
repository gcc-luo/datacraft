name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21', cache: maven}
      - run: mvn --batch-mode test
      - run: mvn --batch-mode package -DskipTests
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: datacraft-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: datacraft-web/package-lock.json}
      - run: npm ci
      - run: npm run build

