spring:
  application:
    name: datacraft
  datasource:
    url: ${DATACRAFT_DB_URL:jdbc:postgresql://localhost:5432/datacraft}
    username: ${DATACRAFT_DB_USERNAME:datacraft}
    password: ${DATACRAFT_DB_PASSWORD:datacraft}
  data:
    redis:
      host: ${DATACRAFT_REDIS_HOST:localhost}
      port: ${DATACRAFT_REDIS_PORT:6379}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
datacraft:
  security:
    jwt:
      secret: ${DATACRAFT_JWT_SECRET}
      expiration-seconds: ${DATACRAFT_JWT_EXPIRATION_SECONDS:7200}
    datasource:
      encryption-key: ${DATACRAFT_DATASOURCE_ENCRYPTION_KEY}
  admin:
    username: ${DATACRAFT_ADMIN_USERNAME}
    password: ${DATACRAFT_ADMIN_PASSWORD}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
server:
  port: ${DATACRAFT_SERVER_PORT:9081}
